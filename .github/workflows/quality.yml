name: Verify SUU
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: python -m pip install fastapi==0.115.12
      - run: python -m unittest discover -s deploy/dell-tts -p 'test_*.py'
      - run: python -m unittest discover -s deploy/dell-ai/admin -p 'test_*.py'
      - run: python -m unittest discover -s deploy/victus -p 'test_*.py'
      - run: npm run build

  windows-victus-setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check Victus PowerShell health path
        shell: powershell
        run: .\deploy\victus\test_setup.ps1
