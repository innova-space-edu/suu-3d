services:
  suu-llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: "2.0"
    mem_limit: 3g
    pids_limit: 150
    ports:
      - "127.0.0.1:8094:8080"
    volumes:
      - ./models:/models:ro
    secrets:
      - suu_api_key
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--model"
      - "/models/Qwen3.5-0.8B-Q4_K_M.gguf"
      - "--alias"
      - "suu-local"
      - "--ctx-size"
      - "2048"
      - "--threads"
      - "2"
      - "--parallel"
      - "1"
      - "--n-predict"
      - "256"
      - "--no-webui"
      - "--api-key-file"
      - "/run/secrets/suu_api_key"
    networks:
      - portal_default

secrets:
  suu_api_key:
    file: ./secrets/suu_api_key.txt

networks:
  portal_default:
    external: true
