services:
  suu-llm:
    container_name: suu-llm
    image: "${SUU_LLM_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}"
    restart: unless-stopped
    init: true
    # Compose uses a local read-only bind for the API key. Its host file is
    # mode 0600, so llama.cpp must run as the actual host file owner.
    # bootstrap-suu.sh writes these non-secret IDs to ~/suu-ai/.env.
    user: "${SUU_RUN_UID:?run bootstrap-suu.sh --apply}:${SUU_RUN_GID:?run bootstrap-suu.sh --apply}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: "${SUU_LLM_CPUS:-2.0}"
    mem_limit: "${SUU_LLM_MEMORY:-3g}"
    pids_limit: 150
    ports:
      - "127.0.0.1:8094:8080"
    volumes:
      - ./models:/models:ro
      - ./secrets/suu_api_key.txt:/run/secrets/suu_api_key:ro
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--model"
      - "/models/${SUU_MODEL_FILE:-Qwen3.5-0.8B-Q4_K_M.gguf}"
      - "--alias"
      - "suu-local"
      - "--ctx-size"
      - "2048"
      - "--threads"
      - "${SUU_LLM_THREADS:-2}"
      - "--parallel"
      - "1"
      - "--n-predict"
      - "256"
      # This small CPU model is used for speech: require visible final text.
      # llama.cpp auto-reasoning can otherwise spend the response budget on thought.
      - "--reasoning"
      - "off"
      - "--no-webui"
      - "--api-key-file"
      - "/run/secrets/suu_api_key"
    networks:
      - portal_default

networks:
  portal_default:
    external: true
